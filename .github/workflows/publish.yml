name: Publish Theme Adapters

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_changesets: ${{ steps.detect.outputs.has_changesets }}
      has_release: ${{ steps.detect.outputs.has_release }}
      adapter_count: ${{ steps.detect.outputs.adapter_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect changesets, adapters, and pending releases
        id: detect
        run: |
          count=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          if [ "$count" -gt 0 ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi
          adapter_count=$(find themes -mindepth 2 -maxdepth 2 -name package.json | wc -l | tr -d ' ')
          echo "adapter_count=$adapter_count" >> "$GITHUB_OUTPUT"
          node scripts/release-state.mjs
          echo "Changesets: $count, adapters: $adapter_count"

  version:
    needs: prepare
    if: needs.prepare.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create GitHub App token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: BlankGrimoire
          repositories: BlankGrimoire-themes

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Open or update version pull request
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          commit-message: 'chore: version theme adapters'
          pr-title: 'chore: version theme adapters'
          create-github-releases: 'false'
          github-token: ${{ steps.release-token.outputs.token }}

  publish:
    needs: prepare
    if: needs.prepare.outputs.has_changesets == 'false' && needs.prepare.outputs.has_release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Create GitHub App token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: BlankGrimoire
          repositories: BlankGrimoire-themes

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify publication locally
        run: pnpm publish:check

      - name: Build, sign, and validate publication
        run: pnpm publish:build
        env:
          BLANKGRIMOIRE_PRIVATE_KEY: ${{ secrets.BLANKGRIMOIRE_PRIVATE_KEY }}
          BLANKGRIMOIRE_PUBLIC_KEY: ${{ vars.BLANKGRIMOIRE_PUBLIC_KEY }}

      - name: Validate index.json
        run: |
          count=$(jq '.extensions | length' public/index.json)
          if [ "$count" -ne "${{ needs.prepare.outputs.adapter_count }}" ]; then
            echo "Expected ${{ needs.prepare.outputs.adapter_count }} adapters, found $count" >&2
            exit 1
          fi
          jq -e '.formatVersion == 1' public/index.json
          jq -e '.publicKey | startswith("ed25519:")' public/index.json
          jq -e '.name == "BlankGrimoire Themes"' public/index.json
          jq -e '[.extensions[].id] | unique | length == length' public/index.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Tag deployed adapters
        run: node scripts/tag-release.mjs
